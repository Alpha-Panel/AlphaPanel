; Inertia SSR server. Needs the SSR bundle (bootstrap/ssr/ssr.mjs or ssr.js, built by `vite build --ssr`);
; without it the process exits at once and supervisor marks it FATAL. startsecs is left at the
; default on purpose: with startsecs=0 a missing bundle would restart in a tight loop forever.
[program:inertia-ssr]
process_name=%(program_name)s
command=/usr/local/bin/php /var/www/AlphaPanel/httpdocs/artisan inertia:start-ssr
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/AlphaPanel/httpdocs/storage/logs/inertia-ssr.log
stopwaitsecs=10
